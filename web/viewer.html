<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Passive Asset Discovery - Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background: #f5f5f5;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background: #333;
      color: white;
    }

    .high {
      color: green;
      font-weight: bold;
    }

    .medium {
      color: orange;
    }

    .low {
      color: gray;
    }

    #status {
      color: #555;
    }

    #network {
      font-weight: bold;
      margin-bottom: 15px;
      padding: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <h1>Discovered Devices</h1>

  <p id="status">Loading...</p>
  <p id="network"></p>

  <table>
    <thead>
      <tr>
        <th>IP</th>
        <th>MAC</th>
        <th>Vendor</th>
        <th>Type</th>
        <th>Confidence</th>
        <th>Hostname</th>
        <th>Evidence</th>
        <th>First seen</th>
        <th>Last seen</th>
      </tr>
    </thead>

    <tbody id="deviceBody"></tbody>
  </table>

  <script>
    function cell(text, cls) {
      const td = document.createElement('td');
      td.textContent = text;
      if (cls) td.className = cls;
      return td;
    }

    async function refresh() {
      const status = document.getElementById('status');

      try {
        const nres = await fetch('/network.json', {
          cache: 'no-store'
        });

        const n = await nres.json();

        const subnet = n.subnet
          ? n.subnet + ' (' + n.subnet_source + ')'
          : 'detecting...';

        document.getElementById('network').textContent =
          'Subnet: ' + subnet +
          '  |  Gateway: ' + (n.gateway || 'detecting...') +
          '  |  Devices: ' + n.device_count;

        const res = await fetch('/assets.json', {
          cache: 'no-store'
        });

        const assets = await res.json();

        const body = document.getElementById('deviceBody');
        body.innerHTML = '';

        assets.forEach(a => {
          const row = document.createElement('tr');

          row.appendChild(cell(a.ip || '-'));
          row.appendChild(cell(a.mac));
          row.appendChild(cell(a.vendor || '-'));
          row.appendChild(cell(a.device_type));
          row.appendChild(cell(a.confidence, a.confidence));
          row.appendChild(cell(a.hostname || '-'));
          row.appendChild(cell((a.evidence || []).join(', ')));
          row.appendChild(cell(a.first_seen));
          row.appendChild(cell(a.last_seen));

          body.appendChild(row);
        });

        status.textContent =
          assets.length + ' devices, updated ' +
          new Date().toLocaleTimeString();

      } catch (e) {
        status.textContent = 'Waiting for the tool...';
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
